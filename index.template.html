<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>CashFlow Budget</title>
<meta name="theme-color" content="#14413A"/>
<meta name="color-scheme" content="dark light"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="CashFlow"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<style>
  /* Layered, and first, because unlayered rules beat every layer.
     The reset below is `*{margin:0;padding:0}`. While this sheet was
     unlayered it lost to the main stylesheet by source order, which is what
     everything downstream was written against. The moment the main stylesheet
     moved into @layer, this reset started winning instead and every padding in
     the app collapsed to zero. The layer order is declared here rather than
     in styles.css because this <style> comes first in the document, and the
     first declaration is the one that fixes the order. */
  @layer boot, app, overrides, responsive, late, utilities, layout, print;
  @layer boot {
  *{box-sizing:border-box;margin:0;padding:0;}
  html{height:100%;-webkit-text-size-adjust:100%;scrollbar-gutter:stable;}
  body{height:100%;background:var(--bg);font-family:var(--font-ui);overflow-x:hidden;}
  #boot{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;
        background:var(--headerBg);}
  .bbar{width:180px;height:3px;background:var(--navyMid);border-radius:2px;overflow:hidden;}
  .bfill{height:100%;background:var(--headerText);border-radius:2px;animation:bload 1.2s ease-in-out infinite;}
  .bicon{display:block;border-radius:12px;margin-bottom:4px;}
  .bname{font-family:var(--font-mono);font-weight:700;color:var(--headerText);font-size:16px;letter-spacing:0.04em;}
  .bmsg{font-size:11px;color:rgba(255,255,255,0.4);}
  @keyframes bload{0%{width:0%}60%{width:80%}100%{width:100%}}
  svg{max-width:100%;}
  }
</style>
<style>__GLOBAL_STYLES__</style>
</head>
<body>
<div id="root">
  <div id="boot">
    <img class="bicon" src="icon-192.png" width="48" height="48" alt=""/>
    <div class="bname">CashFlow</div>
    <div class="bbar"><div class="bfill"></div></div>
    <div class="bmsg">Loading…</div>
  </div>
</div>
<script>__REACT_BUNDLE__</script>
<script>__MINI_RECHARTS__</script>
<script>__SUPABASE_CLIENT__</script>
<script>__APP_CODE__</script>
</body>
</html>
