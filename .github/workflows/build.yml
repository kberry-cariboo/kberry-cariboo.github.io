name: Build index.html from src/

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "index.template.html"
      - "build.js"
      # A schema change can break the client/schema field agreement that
      # tests/payload-fields.mjs checks, so it has to trigger CI too.
      - "supabase/**"
      - "tests/**"
      # The Help page's screenshots. Committed rather than built, so a change
      # here touches no other path — and tests/help-shots.mjs is the only thing
      # that would notice a missing or orphaned one.
      - "images/**"
      - "scripts/**"
  pull_request:
    paths:
      - "src/**"
      - "index.template.html"
      - "build.js"
      # A schema change can break the client/schema field agreement that
      # tests/payload-fields.mjs checks, so it has to trigger CI too.
      - "supabase/**"
      - "tests/**"
      - "images/**"
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # supabase/schema.sql is half of the sync path, and until now nothing in CI
    # ever executed it — the three SQL suites below were written, committed, and
    # then skipped on every run because they need a database. Both bugs found in
    # the round-9 sync review were in this file and neither was reachable from
    # JavaScript: a legacy-blob migration that dropped the schema version (which
    # makes the client multiply every amount by 100 on the next load) and
    # load_household() still handing out a retired API key. A Postgres service
    # costs one container and turns all three suites on.
    services:
      postgres:
        # Tracks the major this schema actually runs on in production: the
        # project's Supabase is Postgres 17.6. It was 16, so the one place
        # supabase/schema.sql got exercised was a different major from the one
        # it ships to — a difference that can only ever show up as a surprise
        # in production, since that is the side with no test.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cf_scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cf_scratch

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 24 is the LTS line (Krypton). It was 26, the Current line, which
          # takes breaking changes and reaches end-of-life sooner — for a repo
          # whose whole Node surface is fs / path / url / http / child_process
          # plus top-level await, there is nothing to gain from being ahead of
          # LTS and a support window to lose by it.
          node-version: "24"

      - name: Build index.html and sw.js
        run: node build.js

      # Correctness-only lint (no-dupe-keys etc.) on the split source, plus
      # no-undef/no-unused-vars on the concatenated bundle (the shared scope
      # the app actually runs in — see eslint.config.mjs and
      # scripts/lint-bundle.js for why those two rules can't run per-file).
      - name: Lint source
        run: |
          node scripts/lint-bundle.js
          npx --yes eslint@10 "src/lib/**/*.js" "src/components/**/*.js" src/App.js build.js .eslint-bundle.js

      # Global install (not a package.json dependency) matches how the rest of
      # this repo has no node_modules — tests/regression.mjs resolves it via
      # `npm root -g` when no local install is present.
      #
      # Pinned, because unpinned it took whatever npm had published that
      # morning. That is how a suite that passed locally on 1.56.1 threw here
      # on 1.62.1: page.accessibility had been removed upstream, and nothing
      # about the diff said so. Bump this deliberately, and run the suite
      # against the new version before you do — see README, "Making a change".
      - name: Install Playwright
        run: |
          npm install -g playwright@1.62.1
          npx playwright@1.62.1 install --with-deps chromium

      # Needs neither a browser nor a database: it reads HOUSEHOLD_FIELDS out of
      # src/lib/household-sync.js and cf_payload_keys() out of
      # supabase/schema.sql and fails if they disagree. That pair is the one
      # place a household field is declared twice, and a mismatch is the exact
      # shape of failure that used to reach production silently.
      - name: Check the client and the schema agree on the payload fields
        run: node tests/payload-fields.mjs

      # Also browser-free: evaluates src/lib/migrate.js directly and checks that
      # a payload from any schema version is upgraded exactly once. Over-
      # migration is silent and multiplies every amount by 100, and the cloud
      # load path runs this on every load, so it gets its own fast check rather
      # than riding on the UI suite.
      - name: Check payloads migrate exactly once
        run: node tests/payload-migration.mjs

      # Browser-free too: drives src/lib/year-copy.js directly. Rolling a year
      # forward reaches four stores at once and has to be safe to re-run, so
      # the scenarios are cheaper and far more thorough as plain data than as
      # clicks. The three buttons that trigger it are covered in the UI suite.
      - name: Check rolling a budget year forward
        run: node tests/year-copy.mjs

      # The Help screenshots are committed, not built, so nothing else notices
      # when the page names a file that isn't there or a shot is left behind
      # after a rename. Browser-free.
      - name: Check the Help screenshots line up
        run: node tests/help-shots.mjs

      # schema.sql expects a Supabase project (an auth schema, auth.uid(), the
      # three Supabase roles). On a bare Postgres those have to be created
      # first — the same shim supabase/schema-test.sql documents in its header.
      - name: Load the schema into the scratch database
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key default gen_random_uuid(), email text);
          create or replace function auth.uid() returns uuid language sql stable as
            $fn$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $fn$;
          do $do$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role nologin; end if;
          end $do$;
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql

      # Re-running schema.sql must stay a no-op — it is the documented upgrade
      # procedure, and the legacy migration and the repair statements in it all
      # run again every time.
      - name: Check the schema is safe to re-run
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql

      - name: Check the schema round-trips what the client sends
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema-test.sql

      - name: Check every payload field survives a save and a load
        run: CF_TEST_PG=1 node tests/payload-roundtrip.mjs

      - name: Check the app against the real SQL
        run: CF_TEST_PG=1 node tests/sync-sql.mjs

      # Reloading a household from the cloud: conflicts, offline edits, a
      # divergence needing the user to choose, receipts. None of it reachable by
      # clicking, all of it data-loss shaped.
      - name: Run cloud sync suite
        run: node tests/cloud-sync.mjs

      - name: Run UI regression suite
        run: node tests/regression.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Everywhere except pushes to main, just verify the build matches what
      # was committed — an out-of-sync index.html should fail here rather
      # than silently drift until it's merged.
      - name: Fail if index.html is out of date
        if: steps.diff.outputs.changed == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          echo "::error::index.html/sw.js are out of sync with src/. Run 'node build.js' locally and commit the result."
          git diff --stat -- index.html sw.js
          exit 1

      # On pushes to main, commit the freshly-built output back so GitHub Pages
      # (which serves index.html and sw.js directly from the branch root)
      # always reflects the current src/.
      - name: Commit rebuilt index.html and sw.js
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Rebuild index.html and sw.js from src/ [skip ci]"
          git push
